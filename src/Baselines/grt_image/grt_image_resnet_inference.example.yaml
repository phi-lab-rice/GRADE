# Anonymous, release-relative configuration for the paper's GRT+Image baseline.
# This is the ResNet-18 implementation in Baselines/grt_image.
paths:
  smoke_eval_root: ../../../evaluation_dataset/Smoke-Eval

training:
  batch_size: 1
  mixed_precision: fp16
  seed: 42

data:
  image_height: 288
  image_width: 512

model:
  resnet18_pretrained: true
